<!DOCTYPE html>
<html>
  <head>

        <!-- القرآن الكريم -->
      <div id="quran-page" class="page">
        <h2>القرآن الكريم <button class="btn btn-outline" style="padding:2px 5px; width:auto; float:left" onclick="nav('main-page')">عودة</button></h2>
        
        <!-- الصندوق الأخضر: البحث النصي للآيات -->
        <div class="input-group" style="background:#e8f5e9; padding:10px; border-radius:4px; border:1px solid #c8e6c9; margin-bottom: 15px;">
          <h3 style="margin-top:0; margin-bottom:8px; color:#2e7d32; font-size:14px; border-bottom:1px solid #c8e6c9; padding-bottom:5px;">البحث النصي (بدون تفسير)</h3>
          
          <div class="input-group" style="margin-bottom: 8px;">
            <label>ابحث بنص الآية:</label>
            <div class="row" style="margin-bottom: 4px;">
              <input type="text" id="quran-text" placeholder="مثال: يسألونك عن الأهلة" style="border-color: #a5d6a7;">
              <button class="btn" style="width: 80px; margin-bottom: 0; background-color: #2e7d32;" onclick="searchQuranText()">بحث</button>
            </div>
          </div>
        </div>
        
        <!-- الصندوق الأزرق: اختيار السورة والآيات والتفسير -->
        <div class="input-group" style="background:#e3f2fd; padding:10px; border-radius:4px; border:1px solid #bbdefb; margin-bottom: 15px;">
          <h3 style="margin-top:0; margin-bottom:8px; color:#1565c0; font-size:14px; border-bottom:1px solid #bbdefb; padding-bottom:5px;">إدراج الآيات بتفسيرها</h3>
          
          <div class="input-group" style="margin-bottom: 10px;">
            <label>اختر السورة:</label>
            <input list="surahs-list" id="surah-select" placeholder="اختر أو ابحث عن السورة..." onchange="updateAyahRange()" style="border-color: #90caf9;">
            <datalist id="surahs-list"></datalist>
          </div>

          <div class="row input-group" style="margin-bottom: 10px;">
            <div><label>من آية:</label><input type="number" id="ayah-from" min="1" value="1" style="border-color: #90caf9;"></div>
            <div><label>إلى آية:</label><input type="number" id="ayah-to" min="1" value="1" style="border-color: #90caf9;"></div>
          </div>

          <div class="input-group" style="margin-bottom: 10px;">
            <label>تفسير الآيات:</label>
            <select id="tafsir-select" style="border-color: #90caf9;">
              <option value="none">بدون تفسير</option>
              <option value="1">التفسير الميسر</option>
              <option value="2">تفسير الجلالين</option>
              <option value="saadi">تفسير السعدي</option>
              <option value="4">تفسير ابن كثير</option>
              <option value="5">تفسير البغوي</option>
              <option value="6">تفسير القرطبي</option>
              <option value="7">تفسير الطبري</option>
              <option value="sahih-int">اللغة الإنجليزية (Sahih International)</option>
            </select>
          </div>

          <!-- فلتر التفسير -->
          <div class="filter-toggle" onclick="toggleFilter('quran-filters', 'quran-arrow')" style="color: #1565c0; margin-bottom: 8px;">
            <span id="quran-arrow">▼</span> خيارات التفسير
          </div>
          <div id="quran-filters" class="filter-content" style="border-top-color: #90caf9; margin-bottom: 15px;">
              <label style="font-weight:normal;">
                <input type="checkbox" id="tafsir-remove-tashkeel"> إزالة التشكيل من نص التفسير
              </label>
          </div>

          <button class="btn btn-secondary" style="background-color: #1565c0; border:none; margin-bottom:0;" onclick="fetchQuranRange()">معاينة الآيات</button>
        </div>

        <!-- مساحة عرض النتائج (مشتركة بين البحثين) -->
        <div id="quran-results"></div>
      </div>

        function initSurahsDropdown() {
          const datalist = document.getElementById('surahs-list');
          surahsData.forEach(s => {
            let option = document.createElement('option');
            option.value = s.id + ". " + s.name;
            datalist.appendChild(option);
          });
        }

        function updateAyahRange() {
          const val = document.getElementById('surah-select').value;
          const match = val.match(/^(\d+)/);
          if(match) {
            const surah = surahsData.find(s => s.id === parseInt(match[1]));
            if(surah) {
              document.getElementById('ayah-from').max = surah.ayahs;
              document.getElementById('ayah-to').max = surah.ayahs;
              document.getElementById('ayah-to').value = surah.ayahs;
            }
          }
        }

        function formatSurahName(rawName) { return rawName.replace(/^س[ُ]?ور[َ]?[ة]?[ُ]?\s*/, '').trim(); }

        function searchQuranText() {
          const query = document.getElementById('quran-text').value;
          if(!query) return;
          showLoader(true);
          google.script.run
            .withSuccessHandler(renderQuranResults)
            .withFailureHandler(err => { showLoader(false); alert(err.message); })
            .searchQuranByText(query);
        }

        function renderQuranResults(results) {
          showLoader(false);
          const div = document.getElementById('quran-results');
          div.innerHTML = '';
          if(!results || results.length === 0) { div.innerHTML = '<div class="error-msg">لا توجد نتائج مطابقة.</div>'; return; }
          
          results.forEach(res => {
            const cleanName = formatSurahName(res.surah.name);
            const sourceText = cleanName + " " + res.numberInSurah;
            const ayahText = res.text + " ﴿" + res.numberInSurah + "﴾";
            
            // بناء رابط القرآن
            const quranUrl = `https://quran.com/${res.surah.number}/${res.numberInSurah}`;
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = '<div>' + ayahText + '</div><div style="color:#777; font-size:11px; margin-top:5px;">[' + sourceText + ']</div>';
            
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'إدراج الآية';
            btn.onclick = function() { 
              insertDataWithOptions({ text: ayahText, source: sourceText, type: 'quran', sourceUrl: quranUrl }); 
            };
            
            card.appendChild(btn);
            div.appendChild(card);
          });
        }

        function fetchQuranRange() {
          const val = document.getElementById('surah-select').value;
          const from = parseInt(document.getElementById('ayah-from').value);
          const to = parseInt(document.getElementById('ayah-to').value);
          
          const tafsirSelect = document.getElementById('tafsir-select');
          const tafsirId = tafsirSelect.value;
          const tafsirName = tafsirSelect.options[tafsirSelect.selectedIndex].text;
          
          const match = val.match(/^(\d+)/);
          if(!match) return alert('الرجاء اختيار السورة بشكل صحيح');
          if (from > to) return alert('نطاق الآيات غير صحيح');
          
          showLoader(true);
          google.script.run
            .withSuccessHandler(renderQuranRange)
            .withFailureHandler(err => { showLoader(false); alert(err.message); })
            .getQuranAndTafsirRange(parseInt(match[1]), from, to, tafsirId, tafsirName);
        }

        function renderQuranRange(data) {
          showLoader(false);
          const div = document.getElementById('quran-results');
          div.innerHTML = '';
          
          if(data.error) { div.innerHTML = '<div class="error-msg">'+data.error+'</div>'; return; }
          
          const verses = data.ayahs;
          if(!verses || verses.length === 0) return;

          const cleanName = formatSurahName(data.surahName);
          let sourceText = verses.length === 1 ? cleanName + " " + verses[0].numberInSurah : cleanName + " " + verses[0].numberInSurah + "-" + verses[verses.length-1].numberInSurah;
          
          let fullAyahText = verses.map(v => v.text + " ﴿" + v.numberInSurah + "﴾").join(' ');
          
          // استخراج رقم السورة لبناء الرابط
          const surahVal = document.getElementById('surah-select').value;
          const surahIdMatch = surahVal.match(/^(\d+)/);
          const surahId = surahIdMatch ? surahIdMatch[1] : "1";
          const fromAyah = verses[0].numberInSurah;
          const toAyah = verses[verses.length-1].numberInSurah;
          const quranUrl = `https://quran.com/${surahId}/${fromAyah}-${toAyah}`;
          
          const cardAyah = document.createElement('div');
          cardAyah.className = 'result-card';
          cardAyah.innerHTML = '<div>' + fullAyahText + '</div><div style="color:#777; font-size:11px; margin-top:5px;">[' + sourceText + ']</div>';
          
          const btnAyah = document.createElement('button');
          btnAyah.className = 'btn';
          btnAyah.innerText = 'إدراج الآيات';
          btnAyah.onclick = function() { 
            insertDataWithOptions({ text: fullAyahText, source: sourceText, type: 'quran', sourceUrl: quranUrl }); 
          };
          
          cardAyah.appendChild(btnAyah);
          div.appendChild(cardAyah);

          if (data.tafsirs && data.tafsirs.length > 0) {
            let removeTashkeelFlag = document.getElementById('tafsir-remove-tashkeel').checked;
            
            let fullTafsirText = data.tafsirs.map(t => {
                let txt = t.text;
                if (removeTashkeelFlag) txt = removeTashkeel(txt);
                return (verses.length > 1 ? "﴿" + t.numberInSurah + "﴾ " : "") + txt.trim();
            }).join('\n\n');

            fullTafsirText = fullTafsirText.replace(sallaRegex, 'ﷺ');
            let tafsirSource = data.tafsirName || "التفسير";
            
            const cardTafsir = document.createElement('div');
            cardTafsir.className = 'result-card';
            cardTafsir.style.marginTop = '10px';
            cardTafsir.style.borderTop = '3px solid #2980b9'; 
            cardTafsir.innerHTML = '<div style="color:#1565c0; font-weight:bold; font-size:11px; margin-bottom:5px;">' + tafsirSource + ':</div><div>' + fullTafsirText.replace(/\n/g, '<br>') + '</div>';
            
            const btnTafsir = document.createElement('button');
            btnTafsir.className = 'btn btn-secondary'; 
            btnTafsir.innerText = 'إدراج التفسير';
            btnTafsir.onclick = function() { 
              // نوثق التفسير بنفس رابط الآية ليسهل الرجوع إليها
              insertDataWithOptions({ text: fullTafsirText, source: tafsirSource, type: 'tafsir', sourceUrl: quranUrl }); 
            };
            
            cardTafsir.appendChild(btnTafsir);
            div.appendChild(cardTafsir);
          }
        }

      </script>
