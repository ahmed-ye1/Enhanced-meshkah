<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
        input[type="color"] {
          -webkit-appearance: none;
          -moz-appearance: none;
          appearance: none;
          width: 28px;
          height: 28px;
          border: none;
          border-radius: 50%;
          cursor: pointer;
          background-color: transparent;
          padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #ccc; border-radius: 50%; }
        input[type="color"]::-moz-color-swatch { border: 1px solid #ccc; border-radius: 50%; }
        .color-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 10px; background: #f9f9f9; color: #333; }
        h2 { font-size: 16px; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; margin-top: 0;}
        .btn { display: block; width: 100%; padding: 8px; margin-bottom: 6px; border: none; background-color: #4CAF50; color: white; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .btn-secondary { background-color: #2196F3; }
        .btn-outline { background-color: transparent; border: 1px solid #ccc; color: #333; }
        .btn:hover { opacity: 0.9; }
        .page { display: none; }
        .active-page { display: block; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="password"], input[type="color"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        input[type="checkbox"], input[type="radio"] { width: auto; margin-left: 8px; cursor: pointer; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .result-card { background: #fff; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 13px; white-space: pre-wrap; line-height: 1.6; }
        #loader { display: none; color: #666; font-size: 12px; text-align: center; margin: 10px 0; font-weight: bold; }
        #sys-error { display: none; color: white; background: red; padding: 10px; font-size: 12px; margin-bottom: 10px; border-radius: 4px; }
        .error-msg { color: #d32f2f; font-weight: bold; font-size: 13px; padding: 10px; border: 1px solid #ef9a9a; background: #ffebee; margin-bottom: 10px;}
        .about-text { font-size: 11px; color: #777; text-align: center; margin-top: 20px; line-height: 1.5; }
        .filter-toggle { cursor: pointer; font-size: 12px; font-weight: bold; margin-top: 8px; user-select: none; display: flex; align-items: center; }
        .filter-toggle span { display: inline-block; width: 15px; transition: transform 0.3s ease; font-size: 10px; }
        .filter-content { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed; }
      </style>
  </head>
  <body>
    
  </body>
</html>
