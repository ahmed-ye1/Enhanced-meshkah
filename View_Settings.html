<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
      <!-- الإعدادات -->
      <div id="settings-page" class="page">
        <h2>الإعدادات <button class="btn btn-outline" style="padding:2px 5px; width:auto; float:left" onclick="nav('main-page')">عودة</button></h2>
        
        <!-- مفتاح API -->
        <div class="input-group" style="background: #e8f5e9; padding: 10px; border-radius: 4px; border: 1px solid #c8e6c9; margin-bottom: 15px;">
          <label style="color: #2e7d32;">
            مفتاح <a href="https://hadithapi.com" target="_blank" style="color: #1b5e20; text-decoration: underline;" title="اضغط هنا للذهاب إلى موقع HadithAPI والحصول على المفتاح">HadithAPI</a> (للبحث الهيكلي):
          </label>
          <input type="password" id="set-apiKey" placeholder="ضع مفتاح API هنا..." style="margin-bottom: 0;">
        </div>

        <!-- جدول الإعدادات المدمج الشامل -->
        <div style="background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 15px;">
          <table class="settings-table">
            <thead>
              <tr>
                <th>النص</th>
                <th title="إدراج التوثيق مع النص">التوثيق</th>
                <th title="التوثيق رابط قابل للنقر" style="cursor: help; text-decoration: underline dotted;">تشعيبي</th>
                <th title="لون المتن الأساسي">لون المتن</th>
                <th title="لون نص التوثيق">لون التوثيق</th>
              </tr>
            </thead>
            <tbody>
              <!-- القرآن والتفسير -->
              <tr>
                <td>الآيات</td>
                <td><input type="checkbox" id="set-citeQuran" title="توثيق الآيات"></td>
                <td><input type="checkbox" id="set-qLink" title="تشعيبي الآيات"></td>
                <td><input type="color" id="set-qColor" title="لون القرآن"></td>
                <td><input type="color" id="set-qSourceColor" title="لون توثيق القرآن"></td>
              </tr>
              <tr>
                <td>التفاسير</td>
                <td><input type="checkbox" id="set-citeTafsir" title="توثيق التفسير"></td>
                <td><input type="checkbox" id="set-tLink" title="تشعيبي التفسير"></td>
                <td><input type="color" id="set-tColor" title="لون التفسير"></td>
                <td></td> <!-- فارغ -->
              </tr>
              
              <!-- الحديث والشرح -->
              <tr>
                <td>الأحاديث</td>
                <td><input type="checkbox" id="set-citeHadith" title="توثيق الحديث"></td>
                <td><input type="checkbox" id="set-hLink" title="تشعيبي الحديث"></td>
                <td><input type="color" id="set-hColor" title="لون الحديث"></td>
                <td><input type="color" id="set-hSourceColor" title="لون توثيق الحديث"></td>
              </tr>
              <tr>
                <td>شرح الأحاديث</td>
                <td><input type="checkbox" id="set-citeSharh" title="توثيق شرح الحديث"></td>
                <td></td> <!-- فارغ، لا يوجد توثيق تشعيبي للشرح -->
                <td><input type="color" id="set-sColor" title="لون شرح الحديث"></td>
                <td></td> <!-- فارغ -->
              </tr>
              
              <!-- تراث -->
              <tr>
                <td>إقتباسات الكتب</td>
                <td><input type="checkbox" id="set-citeTurath" title="توثيق الإقتباس"></td>
                <td><input type="checkbox" id="set-turLink" title="تشعيبي الإقتباس"></td>
                <td><input type="color" id="set-turColor" title="لون إقتباسات تراث"></td>
                <td><input type="color" id="set-turSourceColor" title="لون توثيق تراث"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- إعدادات الخطوط -->
        <div class="input-group" style="background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
          <div style="margin-bottom: 10px;">
            <label style="color: #333;"> الخط:</label>
            <select id="set-font" style="margin-bottom: 0;">
              <option value="Arial">Arial</option>
              <option value="Tahoma">Tahoma</option>
              <option value="Amiri">Amiri</option>
            </select>
          </div>
          <div>
            <label style="color: #333;">حجم النصوص  :</label>
            <input type="number" id="set-fSize" min="8" max="36" value="14" style="margin-bottom: 0;">
          </div>
        </div>

        <button class="btn" style="padding: 10px; font-size: 14px; margin-top: 10px;" onclick="saveSettings()"> حفظ التعديلات</button>
      </div>

      <script>
        function loadSettings() {
          google.script.run.withSuccessHandler(settings => {
            // الألوان
            document.getElementById('set-qColor').value = settings.quranColor || '#000000';
            document.getElementById('set-hColor').value = settings.hadithColor || '#000000';
            document.getElementById('set-sColor').value = settings.sharhColor || '#333333';
            document.getElementById('set-tColor').value = settings.tafsirColor || '#2980b9';
            document.getElementById('set-qSourceColor').value = settings.quranSourceColor || '#7f8c8d';
            document.getElementById('set-hSourceColor').value = settings.hadithSourceColor || '#7f8c8d';
            document.getElementById('set-turColor').value = settings.turathColor || '#2c3e50';
            document.getElementById('set-turSourceColor').value = settings.turathSourceColor || '#7f8c8d';
            
            // الروابط
            document.getElementById('set-qLink').checked = !!settings.quranLinkToggle;
            document.getElementById('set-tLink').checked = !!settings.tafsirLinkToggle;
            document.getElementById('set-hLink').checked = !!settings.hadithLinkToggle;
            document.getElementById('set-turLink').checked = !!settings.turathLinkToggle;
            
            // التوثيق (مفعلة تلقائياً إذا لم يقم المستخدم بتغييرها من قبل)
            document.getElementById('set-citeQuran').checked = settings.citeQuran !== 'false';
            document.getElementById('set-citeTafsir').checked = settings.citeTafsir !== 'false';
            document.getElementById('set-citeHadith').checked = settings.citeHadith !== 'false';
            document.getElementById('set-citeSharh').checked = settings.citeSharh !== 'false';
            document.getElementById('set-citeTurath').checked = settings.citeTurath !== 'false';

            // الخط ومفتاح الـ API
            document.getElementById('set-font').value = settings.fontFamily || 'Arial';
            document.getElementById('set-fSize').value = settings.fontSize || '14';
            
            if (settings.hadithApiKey) {
              document.getElementById('set-apiKey').value = settings.hadithApiKey;
            }
          }).getSettings();
        }

        function saveSettings() {
          const settings = {
            quranColor: document.getElementById('set-qColor').value,
            hadithColor: document.getElementById('set-hColor').value,
            sharhColor: document.getElementById('set-sColor').value,
            tafsirColor: document.getElementById('set-tColor').value,
            quranSourceColor: document.getElementById('set-qSourceColor').value,
            hadithSourceColor: document.getElementById('set-hSourceColor').value,
            turathColor: document.getElementById('set-turColor').value,
            turathSourceColor: document.getElementById('set-turSourceColor').value,
            
            quranLinkToggle: document.getElementById('set-qLink').checked,
            tafsirLinkToggle: document.getElementById('set-tLink').checked,
            hadithLinkToggle: document.getElementById('set-hLink').checked,
            turathLinkToggle: document.getElementById('set-turLink').checked,
            
            citeQuran: document.getElementById('set-citeQuran').checked ? 'true' : 'false',
            citeTafsir: document.getElementById('set-citeTafsir').checked ? 'true' : 'false',
            citeHadith: document.getElementById('set-citeHadith').checked ? 'true' : 'false',
            citeSharh: document.getElementById('set-citeSharh').checked ? 'true' : 'false',
            citeTurath: document.getElementById('set-citeTurath').checked ? 'true' : 'false',

            fontFamily: document.getElementById('set-font').value,
            fontSize: document.getElementById('set-fSize').value,
            quranSourcePos: 'inline', 
            hadithSourcePos: 'inline' 
          };
          
          const apiKeyVal = document.getElementById('set-apiKey').value;
          if(apiKeyVal) settings.hadithApiKey = apiKeyVal;

          showLoader(true);
          google.script.run.withSuccessHandler(() => {
            showLoader(false);
            alert('تم حفظ الإعدادات بنجاح');
          }).saveSettings(settings);
        }
      </script>
  </body>
</html>
